const charCount = (text = '') => Array.from(text).length;
const excerpt = (text = '') => Array.from(text.replace(/\s+/gu, ' ').trim()).slice(0, 120).join('');
const escapeHTML = (text = '') => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function validateLetter(letter, { draft = false } = {}) {
  const errors = {};
  const title = charCount(draft ? letter.title : letter.title.trim());
  const content = charCount(draft ? letter.content : letter.content.trim());
  if (!draft && (title < 2 || title > 80)) errors.title = '标题请写 2–80 个字符。';
  if (!draft && (content < 20 || content > 2000)) errors.content = '正文请写 20–2000 个字符。';
  if (draft && title > 80) errors.title = '标题最多 80 个字符。';
  if (draft && content > 2000) errors.content = '正文最多 2000 个字符。';
  if (charCount(letter.penName || '') > 30) errors.penName = '署名最多 30 个字符。';
  if (letter.visibility === 'private' && !(letter.recipientUsername || '').trim()) errors.recipientUsername = '请填写收件人的用户名。';
  if (!letter.patternId) errors.patternId = '信纸尚未准备好，请稍后重试。';
  return errors;
}

function letterPayload(letter, { draft = false, update = false, privateEnabled = false } = {}) {
  if (letter.visibility === 'private' && !privateEnabled) throw new Error('私人投递暂不可用，未发送任何内容。');
  const common = {
    ...(privateEnabled ? { visibility: letter.visibility || 'public' } : {}),
    title: draft ? letter.title : letter.title.trim(), content: draft ? letter.content : letter.content.trim(),
    recipientType: letter.visibility === 'private' ? 'user' : 'wall', recipientUserId: letter.visibility === 'private' ? letter.recipientUserId : null,
    penName: letter.penName?.trim() || null, isAnonymous: Boolean(letter.isAnonymous),
    locationId: null, patternId: letter.patternId,
    allowResponses: letter.allowResponses ?? false, allowReplies: letter.visibility === 'private' ? false : letter.allowReplies ?? true,
  };
  return update
    ? { ...common, submitForReview: !draft }
    : { ...common, parentLetterId: letter.parentLetterId || null, saveAsDraft: draft };
}

function statusLabel(letter) {
  if (letter.workflowState) return ({ draft:'草稿', pendingReview:'已投递', published:'已公开', returnedForEdit:'草稿', private:'私密已投递' })[letter.workflowState] || '状态待确认';
  if (letter.status === 'deleted') return '已删除';
  if (letter.status === 'draft') return '草稿';
  if (letter.status === 'active' && letter.visibility === 'public') {
    if (letter.publishedAt) return '已公开';
    if (letter.submittedAt) return '已投递';
  }
  if (letter.status === 'active' && letter.visibility === 'private') return '私密已投递';
  return '状态待确认';
}

// 同一次创建超时后复用 Key；更改内容后再创建才换 Key。
function createSubmissionKey(getUUID = () => crypto.randomUUID()) {
  let signature, key;
  return {
    for(payload) {
      const next = JSON.stringify(payload);
      if (signature !== next) { signature = next; key = getUUID(); }
      return key;
    },
    clear() { signature = key = undefined; },
  };
}

class ApiError extends Error {
  constructor(message, { status = 0, code, fieldErrors = {}, requestId, retryAfter = 0 } = {}) {
    super(message); Object.assign(this, { status, code, fieldErrors, requestId, retryAfter });
  }
}

class ApiClient {
  constructor(base, fetcher = globalThis.fetch.bind(globalThis)) {
    this.base = base.replace(/\/$/, ''); this.fetcher = fetcher;
    this.csrfToken = null; this.user = null;
  }
  async request(path, { method = 'GET', body, idempotencyKey, auth = true, retried = false } = {}) {
    const writing = !['GET', 'HEAD'].includes(method);
    if (writing && auth && !this.csrfToken && this.user) await this.refreshCsrf();
    if (writing && auth && !this.csrfToken) {
      throw new ApiError('请重新登录后继续，已经写下的内容会保留。', { status: 401, code: 'SESSION_REAUTH' });
    }
    const headers = { Accept: 'application/json' };
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    if (writing && auth) headers['X-CSRF-Token'] = this.csrfToken;
    if (idempotencyKey) headers['Idempotency-Key'] = idempotencyKey;
    let response;
    try {
      response = await this.fetcher(`${this.base}${path}`, {
        method, headers, credentials: 'include',
        ...(body !== undefined ? { body: JSON.stringify(body) } : {}),
        signal: AbortSignal.timeout(12000),
      });
    } catch {
      throw new ApiError('连接没有完成，请检查网络后重试。内容仍在当前页面。');
    }
    let result;
    try { result = await response.json(); }
    catch { throw new ApiError('服务暂时未返回可用数据，请稍后重试。', { status: response.status }); }
    if (!response.ok || result.code !== 0) {
      if (writing && auth && response.status === 403 && result.code === 40302 && !retried) {
        // 只重试明确的 CSRF 错误；并发请求共用恢复，保持请求体与幂等键。
        if (this.csrfToken === headers['X-CSRF-Token']) await this.refreshCsrf();
        return this.request(path, { method, body, idempotencyKey, auth, retried: true });
      }
      if (response.status === 401) { this.user = null; this.csrfToken = null; }
      const retry = response.headers.get('Retry-After');
      const retryAfter = /^\d+$/.test(retry || '') ? Number(retry) : Math.max(0, Math.ceil((Date.parse(retry) - Date.now()) / 1000)) || 0;
      throw new ApiError(response.status >= 500 ? '服务暂时不可用，请稍后重试。' : (result.message || '操作没有完成，请重试。'), {
        status: response.status, code: result.code, fieldErrors: result.data?.fieldErrors || {},
        requestId: result.requestId || response.headers.get('X-Request-Id'), retryAfter,
      });
    }
    return result.data;
  }
  async refreshCsrf() {
    if (!this.csrfRefresh) {
      this.csrfRefresh = this.request('/auth/csrf').then(data => {
        if (!data?.csrfToken) throw new ApiError('登录验证信息不完整，请稍后重试。');
        this.csrfToken = data.csrfToken;
        return this.csrfToken;
      }).finally(() => { this.csrfRefresh = null; });
    }
    return this.csrfRefresh;
  }
  async session() {
    try { this.user = await this.request('/auth/me'); await this.refreshCsrf(); return this.user; }
    catch (error) { if (error.status === 401) return null; throw error; }
  }
  async login({ account, password }) {
    const data = await this.request('/auth/login', { method: 'POST', body: { account, password }, auth: false });
    this.user = data.user; this.csrfToken = data.csrfToken; return this.user;
  }
  async register({ username, password, displayName }) {
    const data = await this.request('/auth/register', { method: 'POST', body: { username, password, displayName }, auth: false });
    this.user = data.user; this.csrfToken = data.csrfToken; return this.user;
  }
  async logout() { await this.request('/auth/logout', { method: 'POST' }); this.user = null; this.csrfToken = null; }
  metadata() { return this.request('/metadata'); }
  list({ mine = false, page = 1, pageSize = 6, drafts = false, workflowState } = {}) {
    const query = new URLSearchParams({ page, pageSize });
    if (mine && (workflowState === 'draft' || drafts)) query.set('status', 'draft');
    else if (mine && workflowState) query.set('workflowState', workflowState);
    if (!mine) query.set('sort', 'latest');
    return this.request(`${mine ? '/me/letters' : '/letters'}?${query}`);
  }
  inbox({ page = 1, pageSize = 6 } = {}) {
    return this.request(`/me/inbox?${new URLSearchParams({ page, pageSize })}`);
  }
  searchUsers(keyword, { page = 1, pageSize = 20 } = {}) {
    return this.request(`/users/search?${new URLSearchParams({ keyword, page, pageSize })}`);
  }
  detail(id) { return this.request(`/letters/${encodeURIComponent(id)}`); }
  replies(id, { page = 1, pageSize = 6 } = {}) {
    return this.request(`/letters/${encodeURIComponent(id)}/replies?${new URLSearchParams({ page, pageSize })}`);
  }
  remove(id) { return this.request(`/letters/${encodeURIComponent(id)}`, { method: 'DELETE' }); }
  save(payload, { id, key } = {}) {
    return this.request(id ? `/letters/${encodeURIComponent(id)}` : '/letters', {
      method: id ? 'PATCH' : 'POST', body: payload, idempotencyKey: id ? undefined : key,
    });
  }
}

const decorationStorageKey = 'luojia.v21.decorations';
function savedDecorations() {
  try { return JSON.parse(localStorage.getItem(decorationStorageKey) || '{}'); }
  catch { return {}; }
}
function savedDecoration(letterId) { return letterId ? savedDecorations()[letterId] || {} : {}; }
function rememberDecoration(letterId, editor) {
  if (!letterId) return;
  try {
    const values = savedDecorations();
    values[letterId] = { patternId: editor.patternId, stampId: editor.stampId || 'none' };
    localStorage.setItem(decorationStorageKey, JSON.stringify(values));
  } catch {}
}
function safePatternURL(url) { if (typeof url === 'string' && url.startsWith('blob:')) return url;
  if (typeof url !== 'string') return '';
  return /^(assets\/|\.\.\/|\/(?!\/)|https?:\/\/|data:image\/(png|jpeg|webp);base64,)/i.test(url) ? url : '';
}
function resolvePattern(pattern, available = []) {
  return available.find(item => item.id === pattern?.id) || pattern || {};
}

// 按浏览器实际行高分页；不修改正文，不拆开 Emoji 组合。
function fillParagraphs(target, value, continued = false) {
  const parts = value.split(/\n+/);
  target.replaceChildren();
  parts.forEach((part,i) => {
    if(!part.trim()) return;
    const p = document.createElement('p');
    p.textContent = part.replace(/^[\s\u3000]+/, '');
    if(i===0 && continued) p.className='continued';
    target.append(p);
  });
}
function mountLetterReader(sheet) {
  if (!sheet) return () => {};
  const box = sheet.querySelector('.reading-body');
  const text = sheet.querySelector('.letter-content');
  const original = text.textContent;
  const units = typeof Intl.Segmenter === 'function'
    ? Array.from(new Intl.Segmenter('zh', {granularity:'grapheme'}).segment(original), x => x.segment)
    : Array.from(original);
  const prev = sheet.querySelector('[data-page-prev]'), next = sheet.querySelector('[data-page-next]');
  const counter = sheet.querySelector('.paper-page-count');

  const paging = sheet.querySelector('.sheet-paging');
  sheet.insertAdjacentElement('afterend', paging);
  paging.style.maxWidth = getComputedStyle(sheet).maxWidth;
  let pages = [], index = 0, animation, frame, lastSize = '';
  const display = (animate = false, backwards = false) => {
    fillParagraphs(text, pages[index]?.text || '', pages[index]?.continued);
    counter.textContent = `${index + 1} / ${pages.length || 1}`;
    prev.disabled = index === 0; next.disabled = index === pages.length - 1;

    animation?.cancel();
    if (animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      animation = box.animate([
        {transform:`perspective(1000px) rotateY(${backwards ? -7 : 7}deg)`,opacity:.35},
        {transform:'perspective(1000px) rotateY(0)',opacity:1}
      ],{duration:700,easing:'cubic-bezier(.22,.61,.36,1)'});
    }
  };
  const paginate = () => {
    if (!sheet.isConnected) return;

    const size = `${box.clientWidth}:${box.clientHeight}:${getComputedStyle(text).fontSize}`;
    if (size === lastSize) return;
    lastSize = size;
    const anchor = pages[index]?.start || 0;
    const probe = text.cloneNode(false);
    probe.setAttribute('aria-hidden','true');
    Object.assign(probe.style,{position:'absolute',visibility:'hidden',pointerEvents:'none',width:`${box.clientWidth}px`,height:'auto',minHeight:'0',margin:'0',inset:'0 auto auto 0'});
    box.append(probe); pages = [];
    let start = 0;
    while (start < units.length) {
      let low = start + 1, high = units.length, end = start;
      while (low <= high) {
        const middle = Math.floor((low + high) / 2);
        fillParagraphs(probe, units.slice(start,middle).join(''), start > 0 && units[start-1] !== '\n');
        if (probe.getBoundingClientRect().height <= box.clientHeight - 1) { end = middle; low = middle + 1; }
        else high = middle - 1;
      }
      end = Math.max(start + 1,end);
      // 优先在页尾附近的段落或句尾处分开，保留所有空白。
      if (end < units.length) {
        for (let boundary = end; boundary > start + (end-start)*.94; boundary--) {
          if (/[\n。！？.!?]/u.test(units[boundary-1])) { end = boundary; break; }
        }
      }
      pages.push({start,text:units.slice(start,end).join(''),continued:start > 0 && units[start-1] !== '\n'}); start = end;
    }
    probe.remove();
    if (!pages.length) pages = [{start:0,text:''}];
    index = Math.max(0,pages.findLastIndex(page => page.start <= anchor));
    display();
  };
  const turn = delta => {const destination = index + delta;if (destination < 0 || destination >= pages.length) return;index = destination;display(true,delta<0);};
  prev.addEventListener('click',()=>turn(-1));next.addEventListener('click',()=>turn(1));
  const observer = new ResizeObserver(()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(paginate);});
  observer.observe(box);paginate();
  document.fonts?.ready.then(()=>{lastSize='';paginate();});
  return () => {observer.disconnect();cancelAnimationFrame(frame);animation?.cancel();};
}

const samples = [["想把那天的晚霞寄给你", "上周傍晚，从图书馆出来的时候，天边忽然变成了很浅的橘色。我本来已经低头点开了待办清单，走到台阶前，又把手机放回了口袋。那片云实在太慢了，慢得让人不好意思继续赶路。\n\n你以前总说，要给一天留一点发呆的时间。我当时觉得这句话很奢侈，课表、作业、实验报告，把每个空隙都填得满满的，好像只要停下来，就会落后于谁。可是那天我真的坐了一会儿，背包放在脚边，听见有人在楼下讨论晚饭，有人的水杯碰在栏杆上，发出清脆的一声。\n\n旁边坐着两个女生，共用一副耳机。其中一个把手机举起来拍天空，另一个伸手替她挡住镜头前晃动的背带。我不知道她们在听什么歌，却忽然想起，我们以前也会为了拍一张没有路人的照片，在同一个地方等很久。最后照片没拍好，倒把彼此笑弯腰的样子记得很清楚。\n\n后来风有点凉，我去买了一份晚饭。窗口的阿姨问我要不要加辣，我照例说一点点，又想起你每次都替我补一句：她说的一点点，是真的一点点。现在没人替我解释了，我倒也学会自己多说一句。原来长大有时候不是特别了不起的事，只是终于能把这些小小的需求说明白。\n\n回宿舍的路上，天空已经暗下来了。我翻了翻相册，发现刚才那张照片拍得很普通，远没有亲眼看见的好看。本来想删掉，手指停了一下，还是留下了。画面里有一角台阶，有模糊的人影，还有我那天确实坐下来休息过的证据。\n\n写这封信的时候，室友正在找她的充电线，楼道里有人刚洗完衣服回来。生活没有突然变得顺利，明天也还有没做完的事。但我想告诉你，我今天有好好吃饭，有抬头看天，也有在某个很普通的瞬间想起你。\n\n等下次见面，我们再找一个地方坐坐吧。不必等到所有事情都忙完，也不用提前想好要聊什么。", "晚归的人"], ["食堂最后一份热汤", "那天实验结束得很晚，我到食堂时，好几个窗口已经收拾好了。地上还有刚拖过的水痕，椅子一张张收在桌边。我站在门口犹豫，想着要不要回宿舍泡一碗面。\n\n阿姨看见我，隔着玻璃问了一句：“还没吃饭呀？”我点点头，忽然觉得有些不好意思，像是自己来得太迟，打扰了她下班。她没有催我，打开旁边的锅盖，说还有汤，米饭也能盛一点。\n\n热汤端到手里，眼镜立刻起了一层雾。我摘下眼镜，发现桌子对面还有一个同样晚来的同学。他埋头吃饭，书包拉链都没来得及拉好，一角打印纸露在外面。我们谁也没说话，只在阿姨拿来两双筷子时，一起说了声谢谢。\n\n那顿饭其实很简单，菜也不是我平时最喜欢的。可我吃得很慢，连碗底的一点汤都喝完了。离开时阿姨已经换下围裙，我说“您辛苦了”，她摆摆手，提醒我外面起风，把外套穿上。\n\n我一直以为值得写进信里的，应该是特别重要的事情。后来才发现，一顿晚饭、一句随口的关心，也能把很疲惫的一天接住。如果这封信恰好被你读到，希望你今天也能按时吃饭。忙的时候尤其要记得。", "一位珞珈来客"], ["致一起走过雨天的朋友", "还记得我们共撑一把伞走回宿舍的那个下午吗？雨是突然下起来的，出门时明明还有太阳。我们站在教学楼门口，分别翻了一遍书包，最后只找到你那把有点歪的小伞。\n\n你说挤一挤总能回去。我说当然可以，结果刚走出两步，我的鞋就踩进了水坑。那声响太清楚了，你没忍住笑，我也跟着笑起来。前一节课没听明白的题、刚收到的修改意见，忽然都变得没那么要紧。\n\n路上我们认真讨论过怎么撑伞才公平。你往左挪一点，我往右靠一点，伞尖碰到树叶，水又落下来，最后发现两个人的肩膀还是一样湿。我们索性不再调整，专心避开积水，却总在刚说完“这边没水”的时候，再踩中一个小坑。\n\n经过便利店，你提议进去避一会儿。门口挤着几个没带伞的人，大家轮流往外看，像在等待一场没有时间表的演出散场。你买了两盒牛奶，把温的那盒递给我。我握着盒子，听你讲起中学时一次更狼狈的淋雨经历，讲到最夸张的地方，还要腾出一只手比画。\n\n后来雨稍微小了，我们继续往前走。你突然问我，最近是不是不太开心。我记得自己沉默了一会儿，才说有一点。原来有些事情在聊天框里反复打字也说不出口，在两个人并肩走路、谁也不用看着谁的时候，反而可以慢慢讲出来。\n\n你没有马上告诉我该怎么做，也没有说这些事情不值得难过。你只是把伞往我这边偏了一点，问：“那后来呢？”我一直记得这句话。它让我知道，我不必赶快把故事讲成一个已经解决的问题。\n\n到宿舍楼下，我们站着聊了很久。雨水顺着伞骨往下滴，你的袖口湿了一大片，我的鞋也彻底没救了。分别的时候你说，回去先换袜子，其他事情明天再想。我后来真的照做了，洗完热水澡，坐在桌前，第一次没有逼自己立刻恢复精神。\n\n如今每次经过那条路，我都会想起那个下午。我们没做什么特别的事，不过是一起走了一段路，买了两盒牛奶，说了一些平常不肯说的话。可那天之后，我知道自己可以在不那么好的时候给你发消息。\n\n这封信写到这里，窗外又有雨声了。希望你身边有伞，有干燥的袜子，也有愿意听你说“后来呢”的人。下次如果碰巧又只带了一把伞，我们就慢一点走。", "小满"], ["路灯亮起的时候", "我喜欢路灯刚亮起来的那几分钟。天空还留着一点蓝，树影已经深下去了，灯光落在路面上，看起来像有人提前铺好了回去的路。\n\n今天下课以后，我没有直接回宿舍，绕着校园多走了一段。有人抱着书快步经过，有人拎着晚饭，一边走一边提醒电话那头的人：“我知道，已经吃了。”走近了才听见，袋子里的餐盒还在轻轻碰响。原来我们都很擅长先让家里放心，再处理自己的晚饭。\n\n一个小朋友在前面追着影子跑。他每跑到一盏灯下面，影子就换一个方向，他便停下来，认真找一找。大人没有催，只拎着东西在后面慢慢跟着。我在他们后面走了一小段，忽然也低头看了看自己的影子。\n\n我给家里打了个电话。其实没有什么新鲜事，妈妈说阳台上的衣服终于晒干了，我说今天的课有点难。我们把这些小事讲完，又各自安静了一会儿。她问是不是累了，我说还好，正在往回走。\n\n挂断电话后，路已经走到尽头。宿舍楼的窗户亮着，有人从楼上喊朋友的名字。我站了一下，才进门。今天没有发生值得庆祝的大事，但这条路、这通电话，还有楼上那声招呼，让我觉得自己确实属于这里。", "山下"], ["今天也向前走了一点", "这周过得有点慢。有一道题，我来回看了三次，笔记写得很整齐，脑子里却还是乱的。每次听见旁边同学说“这个很简单”，我都想把那一页轻轻翻过去，假装自己也懂了。\n\n今天终于鼓起勇气问了出来。我原本准备了很长的解释，想证明自己不是完全没学，结果对方拿过草稿纸，说：“我们从这里重新画一下。”没有谁笑我，我们只是把条件一条条写出来，再把遗漏的那一步补上。\n\n弄懂的瞬间也没有想象中激动。我先是愣了一下，随后特别想笑：原来我一直卡在这里。回宿舍前，我买了一杯热豆浆，站在路边慢慢喝完，当作这件小事的奖励。\n\n所以给今天留一封短信。以后再遇到不会的东西，希望我能记住，开口问一句并不会让之前的努力失效。今天只前进了一点点，但这一步是真的。", "慢慢来"], ["留一盏灯等你", "你发消息说今晚还要晚一点回来，我看见的时候，正准备关掉桌上的灯。于是把灯罩转了个方向，让光落在靠门的那一小块地方。这样你进来找拖鞋，就不用拿着手机照来照去了。\n\n桌上有一个小面包，是傍晚顺手买的。本来想问你要不要，又怕你忙起来忘记看消息，就挑了你常吃的那一种。袋口没有拆，放在你的杯子旁边。要是不饿，留到明早也可以。\n\n还记得刚住进来的时候，我们彼此都很客气。谁晚睡一点，谁早起一点，都要提前说好多句不好意思。后来慢慢熟悉了，才知道你找不到东西时会先在原地转一圈，我遇到难题时会不停地拧笔帽。很多事情不用问，就能猜个大概。\n\n前几天你回来，看见我还坐在桌前，也没问我为什么没睡，只把一颗糖放到键盘边上。我当时正在赶报告，随口说了谢谢。后来拆糖纸的时候，已经过了十二点。我突然觉得，那颗糖比任何“加油”都有用，因为它不要求我立刻变得精神，只是让我嘴里有一点甜。\n\n我们说好，等这一阵忙完，就去操场走走。其实不必等到哪一天完全空闲，找个普通的晚上也行。不聊成绩，不排计划，随便说说今天遇到了什么人，或者一起安静走两圈。\n\n我先睡了，灯给你留着。回来轻一点，不是怕你吵醒我，是门最近有点响，楼道里总能听见。面包记得拿，明天见。", "室友"], ["在书页里遇见秋天", "翻开借来的书，里面夹着一张旧书签。边角已经磨圆了，背面用铅笔写着一句话：记得看看窗外。我不知道是上一位读者留下的，还是已经跟着这本书走过很多人的书桌。\n\n于是我真的抬起头。窗外那棵树有几片叶子黄了，风吹过来的时候，叶背会翻出浅一点的颜色。前几周它是不是也这样，我竟然完全想不起来。我每天都坐在差不多的位置，却好像从来没有仔细看过它。\n\n那天下午，我只读了十几页。不是因为书不好看，而是某个段落让我想起了很久以前的事情。小时候去旧书店，父亲总会给我一点零钱，让我自己挑一本。我挑得很慢，看封面，也看有没有插图，最后常常选中最厚的那本，觉得这样比较划算。\n\n父亲没有纠正过这种挑法。他站在旁边翻报纸，等我抱着书过来，才帮我看看有没有缺页。买完书，我们会在回家的路上分一袋刚出炉的点心。我一边吃一边急着翻书，他提醒我手上有油，我就把书举得远一点，自以为这样便能两全。\n\n上大学以后，我读书越来越像在完成什么任务。要做笔记，要记住观点，要觉得自己没有浪费时间。有时一页看了很久，脑子里却只剩下还有多少页没读。那张书签让我停了一下，想起自己原本也会因为一个有意思的故事，愿意在旧书店待上一整个下午。\n\n我把书合上，出去走了一会儿。路边有一片叶子落在长椅上，叶脉很清楚，我看了几秒，没有捡走。随后去买了点心，给父亲发了一张照片。他过了好一会儿才回复，问我是不是又只顾着吃甜的，没有好好吃饭。\n\n等回到座位，我重新翻开那一页。这次没有划线，也没有急着总结，只慢慢读下去。书里写到一场告别，我想起家门口那条路，忽然读懂了一点以前略过去的地方。\n\n还书时，我把书签放回原来的位置，没有添字。也许下一位读者正好需要这句话，也许它会一直安静地夹在那里。不管怎样，我已经在那个下午看过窗外了。原来秋天不是突然来的，只是我终于有空认出它。", "书页之间"]];

    app.innerHTML = empty(error.status === 404 ? '这封信暂时无法查看' : '暂时没有取到信', errorText(error), button('重试', 'retry') + ' <a class="button" href="#/mailbox">返回信箱</a>');
    if (error.status === 401) { updateAccount(); openAuth(); }
  }
}
function validate(draft) {
  const errors = validateLetter(state.editor, { draft });
  app.querySelectorAll('[data-error]').forEach(el => { el.textContent = errors[el.dataset.error] || ''; });
  app.querySelectorAll('[name]').forEach(el => el.setAttribute('aria-invalid', String(Boolean(errors[el.name]))));
  if (Object.keys(errors).length) {
    app.querySelector('[aria-invalid=true]')?.focus();
    if (!app.querySelector('[data-error]')) toast(Object.values(errors)[0]);
    return false;
  }
  return true;
}
async function save(draft) {
  if (state.busy || !state.editor || !canRequest() || !validate(draft) || authNeeded()) return false;
  setBusy(true);
  try {
    if (state.editor.visibility === 'private' && !state.editor.recipientUserId) {
      if (demo) state.editor.recipientUserId = 'usr_demo_recipient';
      else {
        const username = state.editor.recipientUsername.trim().toLowerCase();
        const result = await service.searchUsers(username, { pageSize: 20 });
        const recipient = result.items.find(user => user.username.toLowerCase() === username);
        if (!recipient) throw new ApiError('没有找到该收件人。', { fieldErrors: { recipientUsername: '请确认用户名是否正确。' } });
        state.editor.recipientUserId = recipient.id;
        state.editor.recipientUsername = recipient.username;
      }
    }
    const decoration = { patternId: state.editor.patternId, stampId: state.editor.stampId };
    const payload = letterPayload(state.editor, { draft, update: Boolean(state.editor.id), privateEnabled: true });
    if (demo) {
      payload.stampId = state.editor.stampId || 'none';
      payload.recipientUsername = state.editor.recipientUsername.trim();
    }
    else payload.patternId = state.backendPatternId || payload.patternId;
    const letter = await service.save(payload, { id: state.editor.id, key: submission.for(payload) });
    rememberDecoration(letter.id, decoration);
    state.archive = null;
    state.dirty = false; submission.clear();
    if (draft) {
      state.editor.id = letter.id;
      const message = '草稿已保存。';
      const note = app.querySelector('.saved-note'); if (note) note.textContent = message;
      toast(message);
    } else {
      state.editor = null;
      state.list = '#/mine';
      history.replaceState({ deliveryReceipt: {
        letterId: letter.id,
        title: letter.title,
        sentAt: Date.now(),
        userId: service.user.id,
        readyAt: Date.now() + 5000,
      } }, '', '#/delivery');
      render();
    }
    return true;
  } catch (error) { showError(error); return false; }
  finally { setBusy(false); }
}
async function startFrom(letter, edit) {
  if (state.busy) { toast('正在保存，请稍等片刻。'); return; }
  if (!letter || (edit && !letter.canEdit)) return;
  if (state.dirty) { await requestLeave(() => startFrom(letter, edit)); return; }
  const token = state.render;
  await metadata();
  if (token !== state.render) return;
  const decoration = savedDecoration(letter.id);
  state.editor = edit ? { id: letter.id, stampId: letter.stampId || decoration.stampId || 'stamp_1', title: letter.title, content: letter.content, penName: letter.author?.isAnonymous ? '' : letter.author?.displayName || '', isAnonymous: Boolean(letter.author?.isAnonymous), patternId: decoration.patternId || state.metadata.patterns.find(pattern => pattern.id === letter.pattern?.id)?.id || state.metadata.patterns[0].id, parentLetterId: letter.parentLetterId, parentTitle: '', visibility: letter.visibility || 'public', recipientUserId: letter.recipient?.user?.id || null, recipientUsername: letter.recipient?.user?.username || '', allowReplies: letter.allowReplies, allowResponses: letter.allowResponses }
    : { ...ownEditor(), parentLetterId: letter.id, parentTitle: letter.title };
  state.dirty = false; submission.clear(); navigate('#/write');
}

app.addEventListener('input', event => {
  if (!event.target.closest('#editor') || !state.editor) return;
  const input = event.target;
  state.editor[input.name] = input.type === 'checkbox' ? input.checked : input.value;
  if (input.name === 'recipientUsername') state.editor.recipientUserId = null;
  input.removeAttribute('aria-invalid');
  const error = [...app.querySelectorAll('[data-error]')].find(el => el.dataset.error === input.name);
  if (error) error.textContent = '';
  state.dirty = true;
  if (input.name === 'visibility') {
    app.querySelector('#recipient-field').hidden = input.value !== 'private';
    const control = app.querySelector('[name=allowReplies]');
    control.disabled = input.value === 'private';
    control.checked = input.value !== 'private' && state.editor.allowReplies !== false;
    app.querySelector('#reply-setting-note').textContent = input.value === 'private' ? '私密信件不开放公开回信。' : '关闭后，别人仍能阅读公开信件，但不能给它写回信。';
  }
  if (app.querySelector('#word-count')) app.querySelector('#word-count').textContent = `${charCount(state.editor.content)} / 2000`;
  app.querySelector('.saved-note').textContent = '有尚未保存的修改';
});
app.addEventListener('submit', event => {
  if (event.target.id !== 'editor') return;
  event.preventDefault(); if (validate(false)) navigate(route().path === '/write' ? '#/decorate' : '#/preview');
});
app.addEventListener('click', async event => {
  const orientationButton=event.target.closest('[data-orientation]');
  if(orientationButton) {
    app.querySelectorAll('[data-orientation]').forEach(b=>b.setAttribute('aria-pressed',String(b===orientationButton)));
    app.querySelectorAll('[data-orientation-group]').forEach(g=>g.hidden=g.dataset.orientationGroup!==orientationButton.dataset.orientation);
    return;
  }
  const stampSlide=event.target.closest('[data-stamp-slide]'); if(stampSlide){const row=app.querySelector('.stamp-options');row.scrollBy({left:Number(stampSlide.dataset.stampSlide)*row.clientWidth/2,behavior:'smooth'});return;}
  const slide=event.target.closest('[data-slide]');
  if(slide) {const strip=app.querySelector('.pattern-group:not([hidden]) .pattern-options');strip?.scrollBy({left:Number(slide.dataset.slide)*strip.clientWidth*.75,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});return;}

  const envelope = event.target.closest('[data-letter]');
  if (envelope) {
    app.querySelectorAll('.revealed').forEach(el => el.classList.remove('revealed'));
    state.selected = envelope.dataset.letter;
    if (matchMedia('(hover: none)').matches) envelope.classList.add('revealed');
    return;
  }
  const action = event.target.closest('[data-action]')?.dataset.action;
  try {
    if (action === 'encounter') await encounterLetter(event.target.closest('[data-action]'));
    if (action === 'login') goToAuth();
    if (action === 'retry' && canRequest()) render();
    if (action === 'delete-letter') await deleteLetter();
    if (action === 'save') await save(true);
    if (action === 'submit') await save(false);
    if (action === 'reply') await startFrom(state.currentLetter, false);
    if (action === 'edit') await startFrom(state.currentLetter, true);
  } catch (error) { showError(error); }
  if (!action && !event.target.closest('a,button,input,textarea')) {
    state.selected = null; app.querySelectorAll('.revealed').forEach(el => el.classList.remove('revealed'));
  }
});
function openLetter(element) {
  state.positions.set(location.hash || '#/mailbox', window.scrollY);
  state.selected = element.dataset.letter;
  navigate(`#/letter/${encodeURIComponent(element.dataset.letter)}`);
}
app.addEventListener('dblclick', event => { const card = event.target.closest('[data-letter]'); if (card) openLetter(card); });
app.addEventListener('keydown', event => {
  const card = event.target.closest('[data-letter]');
  if (card && event.key === 'Enter') { event.preventDefault(); openLetter(card); }
  if (event.key === 'Escape') { state.selected = null; app.querySelectorAll('.revealed').forEach(el => el.classList.remove('revealed')); }
});
let lastTouch;
app.addEventListener('pointerup', event => {
  if (event.pointerType !== 'touch') return;
  const card = event.target.closest('[data-letter]'); if (!card) return;
  const now = performance.now();
  if (lastTouch?.id === card.dataset.letter && now - lastTouch.time < 380) { openLetter(card); lastTouch = null; }
  else lastTouch = { id: card.dataset.letter, time: now };
});

function openAuth() {
  document.querySelector('#auth-body').innerHTML = demo
    ? '<p>以访客身份继续读信与写信。</p><button class="button primary" data-demo-login type="button">访客进入</button><p class="form-error" role="alert"></p>'
    : `<form id="auth-form"><p class="help">${service.user ? '为继续当前操作，请重新验证登录。内容会保留。' : '登录后继续保存或寄信。'}</p><div class="form-field"><label for="account">用户名</label><input id="account" name="account" required minlength="3" maxlength="32" autocomplete="username" pattern="${state.register ? '[a-z0-9_]+' : '[A-Za-z0-9_]+'}">${state.register ? '<p class="help">仅支持英文小写字母、数字和下划线（_）。</p>' : ''}</div>${state.register ? '<div class="form-field"><label for="display-name">显示名称</label><input id="display-name" name="displayName" required maxlength="30" autocomplete="nickname"></div>' : ''}<div class="form-field"><label for="password">密码</label><input id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="${state.register ? 'new-password' : 'current-password'}"></div><p class="form-error" role="alert"></p><div class="dialog-actions"><button class="text-button" type="button" data-auth-switch>${state.register ? '已有账号，去登录' : '还没有账号？注册'}</button><button class="button primary" type="submit">${state.register ? '注册' : '登录'}</button></div></form>`;
  if (!dialog.open) dialog.showModal();
}
async function authenticate(action) {
  if (!canRequest() || dialog.dataset.busy === 'true') return;
  dialog.dataset.busy = 'true'; dialog.querySelectorAll('button').forEach(b => b.disabled = true);
  try { await action(); dialog.close(); document.querySelector('#auth-body').innerHTML = ''; updateAccount(); if (route().path !== '/write') await render(); toast('已登录，可以继续刚才的操作。'); }
  catch (error) { dialog.querySelector('.form-error').textContent = errorText(error); }
  finally { dialog.dataset.busy = 'false'; dialog.querySelectorAll('button').forEach(b => b.disabled = false); }
}
dialog.addEventListener('click', event => {
  if (event.target.closest('.dialog-close')) dialog.close();
  if (event.target.closest('[data-auth-switch]')) { state.register = !state.register; openAuth(); }
  if (event.target.closest('[data-demo-login]')) authenticate(() => service.login());
});
dialog.addEventListener('submit', event => {
  event.preventDefault(); const data = Object.fromEntries(new FormData(event.target));
  authenticate(() => state.register ? service.register({ username: data.account.toLowerCase(), password: data.password, displayName: data.displayName }) : service.login({ account: data.account.toLowerCase(), password: data.password }));
});
document.querySelector('#account-button').addEventListener('click', async () => {
  if (!service.user) goToAuth();
});
document.querySelector('#logout-button').addEventListener('click', async () => {
  await requestLeave(async () => {
    const control = document.querySelector('#logout-button');
    control.disabled = true;
    try {
      await service.logout();
      state.editor = null; state.currentLetter = null; state.dirty = false; state.archive = null; submission.clear();
      updateAccount(); toast('已退出登录。'); navigate('#/mailbox');
    } catch (error) { toast(errorText(error)); }
    finally { control.disabled = false; }
  });
});
const accountMenu = document.querySelector('#account-menu');
const accountTrigger = document.querySelector('#user-name');
accountTrigger.addEventListener('click', () => {
  const open = accountMenu.classList.toggle('open');
  accountTrigger.setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', event => {
  if (accountMenu.contains(event.target)) return;
  accountMenu.classList.remove('open');
  accountTrigger.setAttribute('aria-expanded', 'false');
});
accountMenu.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  accountMenu.classList.remove('open');
  accountTrigger.setAttribute('aria-expanded', 'false');
  accountTrigger.focus();
});

let renderedHash = location.hash || '#/mailbox';
let leaving = false;
const isEditorRoute = hash => ['/write','/decorate','/preview'].includes(hash.replace(/^#/, '').split('?')[0]);
function choose(title, message, options) {
  const modal = document.querySelector('#choice-dialog');
  modal.innerHTML = `<h2 id="choice-title">${title}</h2><p>${message}</p><div class="dialog-actions">${options.map(([value,label,primary]) => `<button type="button" class="button ${primary ? 'primary' : ''}" data-choice="${value}">${label}</button>`).join('')}</div>`;
  return new Promise(resolve => {
    const finish = value => { modal.removeEventListener('click', click); modal.removeEventListener('cancel', cancel); modal.close(); resolve(value); };
    const click = event => { const value = event.target.closest('[data-choice]')?.dataset.choice; if (value) finish(value); };
    const cancel = event => { event.preventDefault(); finish('cancel'); };
    modal.addEventListener('click', click); modal.addEventListener('cancel', cancel); modal.showModal();
    modal.querySelector('[data-choice=cancel]')?.focus();
  });
}
async function requestLeave(action) {
  if (leaving || state.busy) return;
  if (!state.dirty) { await action(); return; }
  leaving = true;
  try {
    const choice = await choose('这封信还没有保存', '离开前，要先保存草稿吗？暂不保存将离开此页，本次未保存的修改不会保留。', [['save','保存',true],['discard','暂不保存'],['cancel','继续编辑']]);
    if (choice === 'cancel') return;
    if (choice === 'save' && !await save(true)) return;
    state.dirty = false; state.editor = null; submission.clear();
    await action();
  } finally { leaving = false; }
}
async function deleteLetter() {
  if (state.busy || leaving || !canRequest()) return;
  const letter = state.currentLetter;
  if (!letter?.canDelete || authNeeded()) return;
  const draft = letter.status === 'draft';
  leaving = true;
  try {
    const choice = await choose(
      draft ? '删除这封草稿？' : '删除这封信？',
      draft ? '删除后，这封草稿将不再保留。' : '删除后，这封信将无法查看或恢复。',
      [['cancel', '取消'], ['delete', '确认删除', true]]
    );
    if (choice !== 'delete') return;
    setBusy(true);
    await service.remove(letter.id);
    state.archive = null;
    if (state.editor?.id === letter.id) { state.editor = null; state.dirty = false; }
    toast(draft ? '草稿已删除。' : '信件已删除。');
    navigate('#/mine');
  } catch (error) { showError(error); }
  finally { setBusy(false); leaving = false; }
}
window.addEventListener('hashchange', () => {
  const target = location.hash || '#/mailbox';
  if (state.dirty && isEditorRoute(renderedHash) && !isEditorRoute(target)) {
    history.replaceState(null, '', renderedHash);
    requestLeave(() => navigate(target));
  } else render();
});
document.addEventListener('click', event => {
  const link = event.target.closest('a[href]');
  if (!link || event.ctrlKey || event.metaKey || event.shiftKey || link.target === '_blank') return;
  const href = link.getAttribute('href');
  const newLetter = href === '#/write' && !link.hasAttribute('data-continue');
  const leavingEditor = state.dirty && isEditorRoute(renderedHash) && !isEditorRoute(href);
  if (!newLetter && !leavingEditor) return;
  event.preventDefault();
  requestLeave(() => {
    if (newLetter) { state.editor = null; state.dirty = false; submission.clear(); }
    if (href.startsWith('#')) navigate(href); else location.assign(href);
  });
}, true);
window.addEventListener('beforeunload', event => { if (state.dirty) { event.preventDefault(); event.returnValue = ''; } });

window.requestLuojiaLeave=requestLeave;
try { const key='luojia.v17.stampSwap'; if(!localStorage.getItem(key)){for(let j=0;j<localStorage.length;j++){const k=localStorage.key(j);if(!k.startsWith('luojia')||k===key)continue;const raw=localStorage.getItem(k);if(!raw.includes('let_demo_4'))continue;const data=JSON.parse(raw);const walk=o=>{if(!o||typeof o!=='object')return;if(o.id==='let_demo_4')o.stampId='stamp_6';if(o.id==='let_demo_6')o.stampId='stamp_4';Object.values(o).forEach(walk)};walk(data);localStorage.setItem(k,JSON.stringify(data));}localStorage.setItem(key,'1');}}catch{}
await service.session().catch(error => toast(errorText(error)));
updateAccount(); await render(); if(new URLSearchParams(window.luojiaSearch || location.search).get('login') === '1' && !service.user) goToAuth();
