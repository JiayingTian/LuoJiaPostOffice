      required: [letterCount, userCount, runningDays]
      properties:
        letterCount:
          type: integer
          minimum: 0
          example: 12630
        userCount:
          type: integer
          minimum: 0
          example: 8921
        runningDays:
          type: integer
          minimum: 0
          example: 1205

    HomeData:
