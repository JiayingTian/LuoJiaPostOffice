openapi: 3.1.0

info:
  title: 珞珈烟火邮局 API
  version: 0.3.0
  summary: 珞珈烟火邮局前后端接口约定
  description: |
    本文件是前端与后端共同遵守的接口契约，也是联调、Mock、测试和接口文档的唯一事实来源。

    核心约定：
    1. 所有接口使用 UTF-8 JSON；文件上传接口除外。
    2. API 前缀固定为 `/api/v1`，字段统一使用 lowerCamelCase。
    3. 资源 ID 始终作为字符串传输；时间统一使用带时区的 ISO 8601 格式。
    4. 信件与回信正文只接收纯文本，换行使用 `\n`，后端不得原样返回可执行 HTML。
    5. 成功响应的 `code` 固定为 `0`；失败响应使用稳定的业务错误码，前端不根据 message 判断逻辑。
    6. 列表接口统一使用 `page`、`pageSize`、`total` 和 `hasMore`。
    7. Web 端使用 HttpOnly Cookie Session；有副作用的登录态请求同时携带 `X-CSRF-Token`。
    8. 开发环境可允许明确配置的 localhost Origin；携带凭据时禁止使用 `Access-Control-Allow-Origin: *`。
    9. POST 创建接口支持 `Idempotency-Key`，相同用户和相同 Key 在 24 小时内不得创建重复资源。
    10. 本契约发生不兼容变更时必须提升 API 主版本，兼容性新增只提升文档版本。

  x-error-code-ranges:
    success: "0"
    request: "40000-40099"
    authentication: "40100-40199"
    authorization: "40300-40399"
    notFound: "40400-40499"
    conflict: "40900-40999"
    validation: "42200-42299"
    rateLimit: "42900-42999"
    server: "50000-59999"

servers:
  - url: /api/v1
    description: 当前站点同源 API
  - url: http://127.0.0.1:8000/api/v1
    description: FastAPI 本地开发环境

tags:
  - name: Home
    description: 首页聚合数据
  - name: Auth
    description: 登录态与当前用户
  - name: Letters
    description: 信件浏览、创建与管理
  - name: Responses
    description: 信件下的简短文字回应
  - name: Resonance
    description: 信件共鸣
  - name: Favorites
    description: 信件收藏
  - name: Stories
    description: 邮局故事与珞珈印记
  - name: Projects
    description: 特别企划
  - name: Me
    description: 当前用户的信箱与收藏
  - name: Users
    description: 可作为私人信件接收者的用户查询
  - name: Admin
    description: 管理员审核接口
  - name: Metadata
    description: 地点和信纸图案等固定选项

paths:
  /home:
    get:
      tags: [Home]
      operationId: getHome
      summary: 获取首页聚合数据
      description: 首页首次加载只调用此接口，避免分别请求统计数字和推荐内容。
      responses:
        "200":
          description: 首页数据
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /metadata:
    get:
      tags: [Metadata]
      operationId: getMetadata
      summary: 获取固定地点和可用信纸图案
      description: 前端表单只使用此接口返回的可用选项，不允许自行创建地点或图案；初版不提供标签。
      responses:
        "200":
          description: 固定选项集合
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 登录
      description: 登录成功后，后端通过 Set-Cookie 写入 HttpOnly Session，并在响应数据中返回 CSRF Token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              description: HttpOnly、Secure、SameSite=Lax 的会话 Cookie
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 注册普通用户
      description: 自助注册只能创建 role=user 的账户；用户名仅支持小写字母、数字和下划线，并执行唯一性检查。成功后直接建立 Session。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          headers:
            Set-Cookie:
              description: HttpOnly、Secure、SameSite=Lax 的会话 Cookie
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 退出登录
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          $ref: "#/components/responses/SuccessWithoutData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 获取当前登录用户
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/csrf:
    get:
      tags: [Auth]
      operationId: refreshCsrfToken
      summary: 刷新页面后恢复 CSRF Token
      description: 验证 HttpOnly Session Cookie，生成新的 CSRF Token 并使旧 Token 失效；响应禁止缓存。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: CSRF Token 已刷新
          headers:
            Cache-Control:
              description: 固定为 no-store
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/profile:
    patch:
      tags: [Me]
      operationId: updateMyProfile
      summary: 修改当前用户资料
      description: 用户名允许修改；请求包含 username 时必须同时提交 currentPassword，后端重新校验密码和用户名唯一性。
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /users/search:
    get:
      tags: [Users]
      operationId: searchUsers
      summary: 搜索私人信件接收者
      description: 仅返回收件所需的最小公开资料，不返回角色、邮箱或账户状态。
      security:
        - cookieAuth: []
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 用户搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublicListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /letters:
    get:
      tags: [Letters]
      operationId: listLetters
      summary: 获取公开信件列表
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: sort
          in: query
          description: 排序方式
          schema:
            type: string
            enum: [latest, popular, mostReplied]
            default: latest
        - name: keyword
          in: query
          description: 匹配标题、正文摘要和地点
          schema:
            type: string
            maxLength: 50
        - name: locationId
          in: query
          description: 使用固定地点 ID 筛选
          schema:
            type: string
        - name: hasReplies
          in: query
          description: 是否只返回已有回信的信件
          schema:
            type: boolean
      responses:
        "200":
          description: 信件分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Letters]
      operationId: createLetter
      summary: 创建并提交信件
      description: 投递信墙时提交管理员审核；投递某个用户时直接成为双方可见的私人信件；saveAsDraft 为 true 时只保存草稿。
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LetterCreateRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /letters/{letterId}:
    parameters:
      - $ref: "#/components/parameters/LetterId"
    get:
      tags: [Letters]
      operationId: getLetter
      summary: 获取信件详情
      security:
        - {}
        - cookieAuth: []
      responses:
        "200":
          description: 信件详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Letters]
      operationId: updateLetter
      summary: 修改自己的信件
      description: 修改已公开信件时立即清空 publishedAt，旧版本同步停止展示；submitForReview=true 时重新进入审核。
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LetterUpdateRequest"
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      tags: [Letters]
      operationId: deleteLetter
      summary: 删除自己的信件
      description: 后端先执行软删除并立即停止访问；业务数据保留 15 天后物理清理，必要审计记录不保留完整私人正文。
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          $ref: "#/components/responses/SuccessWithoutData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /letters/{letterId}/forward:
    parameters:
      - $ref: "#/components/parameters/LetterId"
    post:
      tags: [Letters]
      operationId: forwardPrivateLetter
      summary: 转发私人信件
      description: 仅为收件用户建立原私人信件的读取授权，不复制正文、不改变原信收件人或可见范围；原信删除后授权立即失效。
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardLetterRequest"
      responses:
        "201":
          description: 转发授权创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardLetterResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /letters/{letterId}/favorite:
    parameters:
      - $ref: "#/components/parameters/LetterId"
    put:
      tags: [Favorites]
      operationId: favoriteLetter
      summary: 收藏信件
      description: 幂等操作；重复收藏仍返回成功。
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: 收藏状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Favorites]
      operationId: unfavoriteLetter
      summary: 取消收藏信件
      description: 幂等操作；尚未收藏时仍返回成功。
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: 收藏状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /letters/{letterId}/resonance:
    parameters:
      - $ref: "#/components/parameters/LetterId"
    put:
      tags: [Resonance]
      operationId: resonateWithLetter
      summary: 对信件表示共鸣
      description: 幂等操作；同一用户对同一信件最多产生一条共鸣记录。
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: 共鸣状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResonanceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Resonance]
      operationId: removeLetterResonance
      summary: 取消信件共鸣
      description: 幂等操作；尚未共鸣时仍返回成功。
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: 共鸣状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResonanceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /letters/{letterId}/replies:
    parameters:
      - $ref: "#/components/parameters/LetterId"
    get:
      tags: [Letters]
      operationId: listLetterReplies
      summary: 获取信件下已公开的完整回信
      description: 只返回直接关联、已经审核通过且未删除的完整回信，首版不支持多层回信树。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 完整回信分页列表，按 publishedAt 和 id 升序排列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /letters/{letterId}/responses:
    parameters:
      - $ref: "#/components/parameters/LetterId"
    get:
      tags: [Responses]
      operationId: listResponses
      summary: 获取信件下已公开的简短回应
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 简短回应分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Responses]
      operationId: createResponse
      summary: 提交简短回应
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseCreateRequest"
      responses:
        "201":
          description: 简短回应已提交管理员审核
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /stories:
    get:
      tags: [Stories]
      operationId: listStories
      summary: 获取邮局故事与珞珈印记列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/StoryCategory"
      responses:
        "200":
          description: 故事分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /stories/{storyId}:
    get:
      tags: [Stories]
      operationId: getStory
      summary: 获取故事详情
      parameters:
        - $ref: "#/components/parameters/StoryId"
      responses:
        "200":
          description: 故事详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: 获取特别企划列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectStatus"
      responses:
        "200":
          description: 企划分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"

  /projects/{projectId}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: 获取特别企划详情
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 企划详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/letters:
    get:
      tags: [Me]
      operationId: listMyLetters
      summary: 获取当前用户写过的信件
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/LetterStatus"
        - name: workflowState
          in: query
          description: 面向作者的派生展示状态，不写入数据库 status 字段。
          schema:
            $ref: "#/components/schemas/LetterWorkflowState"
      responses:
        "200":
          description: 当前用户信件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyLetterListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/inbox:
    get:
      tags: [Me]
      operationId: listMyInbox
      summary: 获取当前用户的私人收件箱
      description: 返回直接发送给当前用户或通过有效转发授权给当前用户的私人信件；原信删除后不再返回。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 私人收件箱分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/favorites:
    get:
      tags: [Me]
      operationId: listMyFavorites
      summary: 获取当前用户收藏的信件
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 收藏信件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/letters:
    get:
      tags: [Admin]
      operationId: listLettersForReview
      summary: 获取等待管理员审核的公开信件
      description: 只返回 visibility=public、status=active、submittedAt 非空且 publishedAt 为空的信件，不包含私人信件。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 审核列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/letters/{letterId}/review:
    post:
      tags: [Admin]
      operationId: reviewLetter
      summary: 审核信件
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/LetterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: 审核完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /admin/responses:
    get:
      tags: [Admin]
      operationId: listResponsesForReview
      summary: 获取等待管理员审核的简短回应
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 简短回应审核列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/responses/{responseId}/review:
    post:
      tags: [Admin]
      operationId: reviewResponse
      summary: 审核简短回应
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ResponseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: 审核完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: luojia_session
      description: 后端设置的 HttpOnly Session Cookie，前端请求需开启 credentials。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 登录后获得；所有有副作用的登录态请求必须携带。

  headers:
    RequestId:
      description: 服务端生成的请求追踪 ID；报错反馈时应一并提交。
      schema:
        type: string
        example: req_01JABCD2EFGH3456789

  parameters:
    Page:
      name: page
      in: query
      description: 从 1 开始的页码
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页数量，最大 50
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    LetterId:
      name: letterId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: let_01JABCD2EFGH3456789
    ResponseId:
      name: responseId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: res_01JABCD2EFGH3456789
    StoryId:
      name: storyId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: sty_01JABCD2EFGH3456789
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: prj_01JABCD2EFGH3456789
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端生成的唯一值，建议使用 UUID；用于防止重复提交。
      schema:
        type: string
        minLength: 16
        maxLength: 128

  responses:
    SuccessWithoutData:
      description: 操作成功
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyResponse"
    BadRequest:
      description: 请求格式、查询参数或 JSON 无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 40001
            message: 请求参数无效
            data:
              fieldErrors:
                pageSize: 必须小于或等于 50
            requestId: req_01JABCD2EFGH3456789
    Unauthorized:
      description: 未登录、会话失效或凭据错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 40101
            message: 请先登录
            data: null
            requestId: req_01JABCD2EFGH3456789
    Forbidden:
      description: 已登录但没有操作权限，或写请求的 CSRF Token 无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            permissionDenied:
              value:
                code: 40301
                message: 无权执行此操作
                data: null
                requestId: req_01JABCD2EFGH3456789
            csrfInvalid:
              value:
                code: 40302
                message: CSRF Token 无效
                data: null
                requestId: req_01JABCD2EFGH3456789
    CsrfForbidden:
      description: CSRF Token 缺失、错误或已经失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 40302
            message: CSRF Token 无效
            data: null
            requestId: req_01JABCD2EFGH3456789
    NotFound:
      description: 资源不存在、已删除或当前用户不可见
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 40401
            message: 资源不存在
            data: null
            requestId: req_01JABCD2EFGH3456789
    Conflict:
      description: 重复提交、状态冲突或资源版本冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 40901
            message: 当前状态不允许执行此操作
            data: null
            requestId: req_01JABCD2EFGH3456789
    ValidationFailed:
      description: 请求格式正确，但内容未通过业务校验或内容安全规则
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 42201
            message: 信件内容未通过校验
            data:
              fieldErrors:
                content: 正文长度必须为 20 至 1500 个字符
            requestId: req_01JABCD2EFGH3456789
    RateLimited:
      description: 请求过于频繁
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 42901
            message: 请求过于频繁，请稍后重试
            data: null
            requestId: req_01JABCD2EFGH3456789
    InternalError:
      description: 服务端内部错误；不得向前端暴露堆栈、SQL 或密钥信息
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 50000
            message: 服务暂时不可用
            data: null
            requestId: req_01JABCD2EFGH3456789

  schemas:
    EmptyResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
          example: success
        data:
          type: "null"
        requestId:
          type: string

    ErrorResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code:
          type: integer
          minimum: 40000
        message:
          type: string
          description: 面向用户的简短中文提示，不作为前端逻辑判断依据。
        data:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ErrorData"
        requestId:
          type: string

    ErrorData:
      type: object
      additionalProperties: true
      properties:
        fieldErrors:
          type: object
          additionalProperties:
            type: string

    Pagination:
      type: object
      required: [page, pageSize, total, hasMore]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean

    UserRole:
      type: string
      enum: [user, admin]

    User:
      type: object
      required: [id, username, displayName, avatarUrl, role, createdAt]
      properties:
        id:
          type: string
          example: usr_01JABCD2EFGH3456789
        username:
          type: string
          pattern: "^[a-z0-9_]{3,32}$"
          example: luojia_guest
        displayName:
          type: string
          minLength: 1
          maxLength: 30
          example: 珞珈来客
        avatarUrl:
          type: [string, "null"]
          format: uri
        role:
          $ref: "#/components/schemas/UserRole"
        createdAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      additionalProperties: false
      required: [account, password]
      properties:
        account:
          type: string
          minLength: 3
          maxLength: 32
          description: 用户名；后端查询前统一转为小写。
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password, displayName]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9_]{3,32}$"
          description: 仅支持 3–32 位英文小写字母、数字和下划线。
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 30

    UserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      dependentRequired:
        username: [currentPassword]
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9_]{3,32}$"
          description: 后端统一转为小写保存；修改此字段时 currentPassword 必填。
        displayName:
          type: string
          minLength: 1
          maxLength: 30
        avatarUrl:
          type: [string, "null"]
          format: uri
          maxLength: 500
        currentPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: 修改 username 时用于重新验证身份，不会写入资料表。

    AuthData:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          minLength: 16
          description: 仅保存在内存中，不写入 localStorage。

    AuthResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/AuthData"
        requestId:
          type: string

    CsrfData:
      type: object
      required: [csrfToken]
      properties:
        csrfToken:
          type: string
          minLength: 16
          description: 新生成的 CSRF Token，只保存在前端内存中。

    CsrfResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/CsrfData"
        requestId:
          type: string

    UserResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
        data:
          $ref: "#/components/schemas/User"
        requestId:
          type: string

    LetterStatus:
      type: string
      description: 审核过程不占用状态枚举，由 submittedAt、publishedAt 和审核记录表达。
      enum: [draft, active, deleted]

    LetterVisibility:
      type: string
      enum: [public, private]

    LetterWorkflowState:
      type: string
      description: 面向作者列表的派生展示状态，不写入数据库的 status 字段。
      enum: [draft, pendingReview, published, returnedForEdit]

    RecipientType:
      type: string
      enum: [wall, user]

    Recipient:
      type: object
      required: [type, user]
      properties:
        type:
          $ref: "#/components/schemas/RecipientType"
        user:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/UserPublic"

    UserPublic:
      type: object
      required: [id, username, displayName, avatarUrl]
      properties:
        id:
          type: string
        username:
          type: string
          pattern: "^[a-z0-9_]{3,32}$"
        displayName:
          type: string
        avatarUrl:
          type: [string, "null"]
          format: uri

    MetadataOption:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    PatternOption:
      allOf:
        - $ref: "#/components/schemas/MetadataOption"
        - type: object
          required: [previewUrl, assetUrl]
          properties:
            previewUrl:
              type: string
              format: uri
            assetUrl:
              type: string
              format: uri

    AuthorView:
      type: object
      required: [displayName, isAnonymous]
      properties:
        displayName:
          type: string
          example: 一位珞珈来客
        isAnonymous:
          type: boolean

    LetterSummary:
      type: object
      required:
        - id
        - title
        - excerpt
        - author
        - recipient
        - location
        - pattern
        - status
        - visibility
        - submittedAt
        - publishedAt
        - resonanceCount
        - favoriteCount
        - responseCount
        - replyCount
        - isResonated
        - isFavorited
      properties:
        id:
          type: string
          example: let_01JABCD2EFGH3456789
        title:
          type: string
          maxLength: 80
        excerpt:
          type: string
          maxLength: 120
        author:
          $ref: "#/components/schemas/AuthorView"
        recipient:
          $ref: "#/components/schemas/Recipient"
        location:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/MetadataOption"
        pattern:
          $ref: "#/components/schemas/PatternOption"
        status:
          $ref: "#/components/schemas/LetterStatus"
        visibility:
          $ref: "#/components/schemas/LetterVisibility"
        submittedAt:
          type: [string, "null"]
          format: date-time
        publishedAt:
          type: [string, "null"]
          format: date-time
        resonanceCount:
          type: integer
          minimum: 0
        favoriteCount:
          type: integer
          minimum: 0
        responseCount:
          type: integer
          minimum: 0
        replyCount:
          type: integer
          minimum: 0
        isResonated:
          type: boolean
          description: 未登录时固定为 false。
        isFavorited:
          type: boolean
          description: 未登录时固定为 false。

    Letter:
      allOf:
        - $ref: "#/components/schemas/LetterSummary"
        - type: object
          required:
            - content
            - parentLetterId
            - allowResponses
            - allowReplies
            - createdAt
            - updatedAt
            - canEdit
            - canDelete
            - canForward
            - reviewNote
          properties:
            content:
              type: string
              minLength: 0
              maxLength: 1500
              description: 纯文本正文；作者读取草稿时允许少于 20 个字符。
            parentLetterId:
              type: [string, "null"]
              description: 完整回信所关联的原信 ID；首版不允许原信本身已有 parentLetterId。
            allowResponses:
              type: boolean
            allowReplies:
              type: boolean
              description: 当前信件是否允许创建完整回信；后端仍会检查信件状态和调用者权限。
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            canEdit:
              type: boolean
            canDelete:
              type: boolean
            canForward:
              type: boolean
              description: 仅当前用户有权读取的有效私人信件可以为 true。
            reviewNote:
              type: [string, "null"]
              maxLength: 300

    LetterCreateRequest:
      type: object
      additionalProperties: false
      required: [saveAsDraft]
      allOf:
        - if:
            properties:
              saveAsDraft:
                const: false
            required: [saveAsDraft]
          then:
            required:
              - title
              - content
              - recipientType
              - isAnonymous
              - patternId
              - allowResponses
              - allowReplies
            properties:
              title:
                minLength: 2
              content:
                minLength: 20
      properties:
        title:
          type: string
          minLength: 0
          maxLength: 80
          default: ""
        content:
          type: string
          minLength: 0
          maxLength: 1500
          default: ""
          description: 纯文本正文；草稿允许为空，正式提交时至少 20 个 Unicode 字符。
        recipientType:
          $ref: "#/components/schemas/RecipientType"
        recipientUserId:
          type: [string, "null"]
          description: recipientType 为 user 时必填；为 wall 时必须为空。
        parentLetterId:
          type: [string, "null"]
          description: 创建完整回信时填写；首版仅允许一层关联。
        penName:
          type: [string, "null"]
          maxLength: 30
        isAnonymous:
          type: boolean
        locationId:
          type: [string, "null"]
        patternId:
          type: string
          description: 草稿可省略；后端只能在恰有一个启用图案时自动选择。
        allowResponses:
          type: boolean
          default: true
        allowReplies:
          type: boolean
          default: true
        saveAsDraft:
          type: boolean
          default: false

    LetterUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 0
          maxLength: 80
        content:
          type: string
          minLength: 0
          maxLength: 1500
          description: 草稿允许为空；submitForReview=true 时后端对信件完整状态执行正式校验。
        recipientType:
          $ref: "#/components/schemas/RecipientType"
        recipientUserId:
          type: [string, "null"]
        penName:
          type: [string, "null"]
          maxLength: 30
        isAnonymous:
          type: boolean
        locationId:
          type: [string, "null"]
        patternId:
          type: string
        allowResponses:
          type: boolean
        allowReplies:
          type: boolean
        submitForReview:
          type: boolean
          description: 修改完成后是否重新提交审核；已公开信件一旦修改，旧版本无论此值为何都立即停止展示。

    ForwardLetterRequest:
      type: object
      additionalProperties: false
      required: [recipientUserId]
      properties:
        recipientUserId:
          type: string
          minLength: 1
          description: 获得该私人信件读取权限的用户 ID。

    ForwardLetterData:
      type: object
      required: [id, letterId, recipient, createdAt]
      properties:
        id:
          type: string
          example: fwd_01JABCD2EFGH3456789
        letterId:
          type: string
        recipient:
          $ref: "#/components/schemas/UserPublic"
        createdAt:
          type: string
          format: date-time

    ResponseStatus:
      type: string
      description: 审核过程由 submittedAt、publishedAt 和审核记录表达。
      enum: [active, deleted]

    Response:
      type: object
      required: [id, letterId, content, author, status, submittedAt, publishedAt, createdAt]
      properties:
        id:
          type: string
          example: res_01JABCD2EFGH3456789
        letterId:
          type: string
        content:
          type: string
          minLength: 2
          maxLength: 500
        author:
          $ref: "#/components/schemas/AuthorView"
        status:
          $ref: "#/components/schemas/ResponseStatus"
        submittedAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    ResponseCreateRequest:
      type: object
      additionalProperties: false
      required: [content, isAnonymous]
      properties:
        content:
          type: string
          minLength: 2
          maxLength: 300
          description: 纯文本简短回应，不接收 HTML。
        penName:
          type: [string, "null"]
          maxLength: 30
        isAnonymous:
          type: boolean

    FavoriteData:
      type: object
      required: [letterId, isFavorited, favoriteCount]
      properties:
        letterId:
          type: string
        isFavorited:
          type: boolean
        favoriteCount:
          type: integer
          minimum: 0

    ResonanceData:
      type: object
      required: [letterId, isResonated, resonanceCount]
      properties:
        letterId:
          type: string
        isResonated:
          type: boolean
        resonanceCount:
          type: integer
          minimum: 0

    HomeStatistics:
      type: object
      required: [letterCount, userCount, runningDays]
      properties:
        letterCount:
          type: integer
          minimum: 0
          example: 12630
        userCount:
          type: integer
          minimum: 0
          example: 8921
        runningDays:
          type: integer
          minimum: 0
          example: 1205

    HomeData:
      type: object
      required: [statistics, featuredLetters, featuredStories, specialProjects]
      properties:
        statistics:
          $ref: "#/components/schemas/HomeStatistics"
        featuredLetters:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/LetterSummary"
        featuredStories:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/StorySummary"
        specialProjects:
          type: array
          maxItems: 4
          items:
