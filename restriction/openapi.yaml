      required: [statistics, featuredLetters, featuredStories, specialProjects]
      properties:
        statistics:
          $ref: "#/components/schemas/HomeStatistics"
        featuredLetters:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/LetterSummary"
        featuredStories:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/StorySummary"
        specialProjects:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/ProjectSummary"

    StoryCategory:
